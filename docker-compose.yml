services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking_recovery_loop
      POSTGRES_USER: booking_recovery_loop
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - booking-recovery-loop-postgres:/var/lib/postgresql/data

volumes:
  booking-recovery-loop-postgres:
