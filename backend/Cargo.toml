[package]
name = "booking-recovery-loop-api"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "booking-recovery-loop-api"
path = "src/main.rs"

[dependencies]
axum = "0.8.8"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
