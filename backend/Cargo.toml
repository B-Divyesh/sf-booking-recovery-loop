[package]
name = "booking-recovery-loop-api"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "booking-recovery-loop-api"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
axum = "0.8.8"
base64 = "0.22.1"
chrono = { version = "0.4.40", features = ["serde"] }
getrandom = "0.3.3"
hex = "0.4.3"
hmac = "0.12.1"
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "any", "migrate", "macros"] }
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum", "tracing"] }
tower-http = { version = "0.6.6", features = ["compression-gzip", "fs", "request-id", "set-header", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.16.0", features = ["serde", "v7"] }

[dev-dependencies]
http-body-util = "0.1.3"
